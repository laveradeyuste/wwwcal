# Publica en GitHub Pages (wwwcal.laveradeyuste.com) la rama «desarrollo»
# de laveradeyuste/contenido.
#
# El repositorio "contenido" es privado: se clona con una deploy key de solo
# lectura cuya clave privada está en el secret CONTENIDO_DEPLOY_KEY.

name: Desplegar web

on:
  # Cambios en este propio workflow
  push:
    branches: [main]
  # Aviso desde "contenido" (gh api repos/laveradeyuste/www/dispatches)
  repository_dispatch:
    types: [contenido-actualizado]
  # Lanzamiento manual desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez, sin cancelar el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar contenido
        uses: actions/checkout@v7
        with:
          repository: laveradeyuste/contenido
          ref: desarrollo
          ssh-key: ${{ secrets.CONTENIDO_DEPLOY_KEY }}
          persist-credentials: false
          path: sitio

      # Cuando la web pase a Astro/Angular, aquí irán setup-node, npm ci y
      # npm run build, y "path" del artefacto apuntará a la carpeta generada.

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
